<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema Digital de Trámites | IESTP Chupa</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">IE</div>
        <div><strong>IESTP Chupa</strong><span>Secretaría Académica</span></div>
      </div>
      <nav>
        <button class="nav-item active" data-view="dashboard">⌂ <span>Inicio</span></button>
        <button class="nav-item" data-view="nuevo">＋ <span>Nuevo trámite</span></button>
        <button class="nav-item" data-view="seguimiento">⌕ <span>Seguimiento</span></button>
        <button class="nav-item" data-view="tramites">▤ <span>Trámites</span></button>
        <button class="nav-item" data-view="reportes">▥ <span>Reportes</span></button>
      </nav>
      <div class="sidebar-footer">Prototipo V.0.2<br><small>GitHub Pages</small></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <div class="eyebrow">SISTEMA DIGITAL</div>
          <h1 id="pageTitle">Panel de Secretaría Académica</h1>
        </div>
        <div class="user-chip">👤 Secretaría</div>
      </header>
      <section id="app"></section>
    </main>
  </div>
  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
